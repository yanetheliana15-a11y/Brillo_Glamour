{% load static %}
<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Registro - Brillo & Glamour</title>

    <link rel="stylesheet" href="{% static 'core/css/style.css' %}">
</head>

<body>

    <section class="hero">

        <h2>Crear cuenta</h2>

        <p>Regístrate en Brillo & Glamour para gestionar tus reservas.</p>

        <form method="POST">
            {% csrf_token %}

            <label for="username">Nombre de usuario</label>
            <input type="text"
                id="username"
                name="username"
                placeholder="Escribe tu nombre de usuario"
                required>

            <label for="email">Correo electrónico</label>
            <input type="email"
                id="email"
                name="email"
                placeholder="Escribe tu correo"
                required>

            <label for="password">Contraseña</label>
            <input type="password"
                id="password"
                name="password"
                placeholder="Crea una contraseña"
                required>

            <button type="submit" class="btn-reservar">
                Crear cuenta
            </button>

        </form>

    </section>

</body>

</html>
