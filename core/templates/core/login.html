
{% load static %}
<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar sesión | Brillo &amp; Glamour</title>
    <link rel="stylesheet" href="{% static 'core/css/style.css' %}">
</head>

<body>

    <section class="login-page">

        <h2>Iniciar sesión</h2>

        <p>Ingresa a tu cuenta de Brillo &amp; Glamour.</p>

        {% if messages %}
            {% for message in messages %}
                <p class="mensaje {{ message.tags }}">{{ message }}</p>
            {% endfor %}
        {% endif %}

        <form method="POST">
            {% csrf_token %}

            <label for="username">Nombre de usuario</label>
            <input
                type="text"
                id="username"
                name="username"
                placeholder="Escribe tu usuario"
                autocomplete="username"
                required
            >

            <label for="password">Contraseña</label>
            <input
                type="password"
                id="password"
                name="password"
                placeholder="Escribe tu contraseña"
                autocomplete="current-password"
                required
            >

            <button type="submit" class="btn-reservar">
                Iniciar sesión
            </button>
        </form>

        <p>¿No tienes cuenta? <a href="{% url 'registro' %}">Regístrate</a></p>

        <a href="{% url 'inicio' %}" class="volver-inicio">
            Volver al inicio
        </a>

    </section>

</body>
</html>
